server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;

    location = /ternaku { return 308 /ternaku/; }
    location ^~ /ternaku/ {
        proxy_pass http://api:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
    }
    location ^~ /_next/static/ {
        add_header Cache-Control "public,max-age=31536000,immutable";
        try_files $uri @legacy_static;
    }
    location @legacy_static {
        root /srv/ternaku-legacy;
        add_header Cache-Control "public,max-age=31536000,immutable";
        try_files $uri =404;
    }
    location = /mobile/android-release.json {
        root /srv/ternaku-legacy;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /mobile/TernaKu.apk {
        root /srv/ternaku-legacy;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="TernaKu.apk"';
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

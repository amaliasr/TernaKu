name: TernaKu — checks and deployment packages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ternaku-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: ternaku_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NEXT_PUBLIC_DEMO_MODE: "false"
      NEXT_PUBLIC_API_URL: https://api.buildmanagement.id/ternaku
      APP_ENV: development
      APP_URL: http://127.0.0.1:8081
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: ternaku_test
      DB_USER: root
      DB_PASSWORD: ci-test-password
      ALLOW_TEST_RESET: "1"
      TEST_API_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, curl
          coverage: none
          tools: none
      - name: Install frontend dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test domain rules
        run: npm test
      - name: Check application PHP syntax
        run: |
          find api/application api/scripts api/tests -name '*.php' -print0 | xargs -0 -n 1 php -l
          php -l api/index.php
          php -l api/router.php
      - name: Start isolated test API
        run: |
          php -S 127.0.0.1:8081 -t api api/router.php > "$RUNNER_TEMP/ternaku-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ternaku-api.log"
          exit 1
      - name: Test HTTP API and concurrent MySQL stock writes
        run: php api/tests/integration.php
      - name: Build production frontend
        run: npm run build
      - name: Package API with an explicit deployment allowlist
        run: |
          mkdir -p "$RUNNER_TEMP/ternaku-deploy/api/application/logs"
          cp api/index.php api/.htaccess api/.env.example api/schema.sql api/CI-LICENSE.txt api/README.md api/PEMASANGAN.md "$RUNNER_TEMP/ternaku-deploy/api/"
          cp -R api/system "$RUNNER_TEMP/ternaku-deploy/api/system"
          cp -R api/application/config api/application/controllers api/application/libraries "$RUNNER_TEMP/ternaku-deploy/api/application/"
          if [ -d api/application/views ]; then cp -R api/application/views "$RUNNER_TEMP/ternaku-deploy/api/application/views"; fi
          mkdir -p "$RUNNER_TEMP/ternaku-deploy/api/scripts"
          cp api/scripts/env.php api/scripts/install.php "$RUNNER_TEMP/ternaku-deploy/api/scripts/"
          touch "$RUNNER_TEMP/ternaku-deploy/api/application/logs/.gitkeep"
          tar -czf "$RUNNER_TEMP/ternaku-api.tar.gz" -C "$RUNNER_TEMP/ternaku-deploy/api" .
          if tar -tzf "$RUNNER_TEMP/ternaku-api.tar.gz" | grep -E '(^|/)(\.env$|\.test-|tests/|upstream/|\.runtime/)|\.zip$|\.log$'; then
            echo 'Unexpected secret or test file in deployment package.' >&2
            exit 1
          fi
      - name: Upload frontend static files
        uses: actions/upload-artifact@v7
        with:
          name: ternaku-web
          path: out/
          if-no-files-found: error
          retention-days: 14
      - name: Upload API deployment archive
        uses: actions/upload-artifact@v7
        with:
          name: ternaku-api
          path: ${{ runner.temp }}/ternaku-api.tar.gz
          if-no-files-found: error
          retention-days: 14

# This workflow verifies and packages. Domain deployment requires separate hosting credentials.

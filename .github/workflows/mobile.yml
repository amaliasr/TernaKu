name: TernaKu mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - name: Assemble Android preview
        working-directory: mobile/android
        run: bash gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: TernaKu-Android-preview
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Build and package the iOS simulator app
        run: |
          xcodebuild -project mobile/ios/TernaKu.xcodeproj -scheme TernaKu -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ternaku-ios" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ternaku-ios/Build/Products/Debug-iphonesimulator/TernaKu.app" "$RUNNER_TEMP/TernaKu-simulator.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: TernaKu-iOS-simulator
          path: ${{ runner.temp }}/TernaKu-simulator.zip
          if-no-files-found: error
          retention-days: 14

name: TernaKu production restore

on:
  pull_request:
    paths:
      - ".github/workflows/vps-production-restore.yml"
      - "deploy/vps/production/**"
      - "deploy/vps/Dockerfile"
      - "api/schema.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_FILE: deploy/vps/production/compose.yaml
      PROD_DB_PASSWORD: local-disposable-app
      PROD_DB_ROOT_PASSWORD: local-disposable-root
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check legacy, account protection and generated column compatibility
        run: python3 deploy/vps/production/test_restore.py
      - name: Start an isolated empty MySQL 8.4 target
        run: |
          docker network create ternaku-prod-ingress
          docker compose --profile push config --quiet
          docker compose build db
          docker compose up -d --no-build --pull never --wait --wait-timeout 180 db
      - name: Restore all records and verify a second run cannot overwrite data
        run: |
          umask 077
          dump="$RUNNER_TEMP/synthetic.sql"
          sed -e '/^INSERT IGNORE INTO /d' -e 's/DEFAULT CHARSET=utf8mb4;/DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_uca1400_ai_ci;/' api/schema.sql > "$dump"
          cat >> "$dump" <<'SQL'
          INSERT INTO users(id,name,email,username,password_hash,role,active,is_superadmin,deleted_at,can_check_stock) VALUES
          ('demo','Test','test@example.invalid','test.username','fake','admin',1,1,NULL,0),
          ('former','Former employee','former@example.invalid','former.username','fake','employee',0,0,'2026-11-01 15:23:45',0),
          ('checker','Stock checker','checker@example.invalid','checker.username','fake','employee',1,0,NULL,1);
          INSERT INTO tokens(token_hash,user_id,expires_at) VALUES (REPEAT('a',64),'demo','2030-01-01');
          INSERT INTO command_requests(user_id,request_id,fingerprint) VALUES ('demo','once',REPEAT('f',64));
          INSERT INTO command_mutex VALUES (1,7);
          INSERT INTO stock VALUES ('egg:good',99,5.944,1),('egg:cracked',3,0.2,0);
          INSERT INTO login_attempts VALUES (REPEAT('b',64),1,'2026-01-01');
          INSERT INTO records(id,sequence,kind,user_id,occurred_at,data) VALUES
          ('one',2,'push_subscription','demo','2026-01-01','{"fixture":true}'),
          ('two',7,'sale','former','2026-01-01','{"customer":"Pélanggan","photo":"data:image/png;base64,aGVsbG8="}'),
          ('three',14,'push_job','demo','2099-01-01','{"fixture":true}'),
          ('four',15,'stock_check_assignment','checker','2026-11-01','{"assigned":true}'),
          ('five',16,'stock_check','checker','2026-11-01','{"status":"pending","reason":"Fixture count"}');
          ALTER TABLE records AUTO_INCREMENT=48;
          SQL
          sha=$(sha256sum "$dump" | cut -d' ' -f1)
          runner=(python3 deploy/vps/production/restore.py "$dump" --sha256 "$sha")
          valid=users=3,records=5,login_attempts=1,stock=2,command_mutex=1,command_requests=1,tokens=1
          # Import a pre-upgrade schema as well; the new target can supply defaults.
          legacy="$RUNNER_TEMP/legacy.sql"
          cp "$dump" "$legacy"
          cat >> "$legacy" <<'SQL'
          ALTER TABLE users DROP INDEX users_username_unique, DROP COLUMN username, DROP COLUMN is_superadmin, DROP COLUMN deleted_at, DROP COLUMN can_check_stock;
          ALTER TABLE records DROP COLUMN compact_data, DROP COLUMN photo_version;
          SQL
          legacy_sha=$(sha256sum "$legacy" | cut -d' ' -f1)
          python3 deploy/vps/production/restore.py "$legacy" --sha256 "$legacy_sha" --check --counts "$valid"
          if "${runner[@]}" --apply --counts "${valid/records=5/records=4}"; then exit 1; fi
          "${runner[@]}" --check --counts "$valid"
          "${runner[@]}" --apply --counts "$valid"
          if "${runner[@]}" --apply --counts "$valid"; then exit 1; fi
          docker compose exec -T db sh -ec '
            export MYSQL_PWD="$MYSQL_PASSWORD"
            exec mysql --default-character-set=utf8mb4 -N -s -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "
              SET SESSION information_schema_stats_expiry=0;
              SELECT AUTO_INCREMENT FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name=\"records\";
            "
          ' | grep -x 48
          docker compose exec -T db sh -ec '
            export MYSQL_PWD="$MYSQL_PASSWORD"
            exec mysql --default-character-set=utf8mb4 -N -s -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT username FROM users WHERE id=\"demo\";"
          ' | grep -Fx 'test.username'
          docker compose exec -T db sh -ec '
            export MYSQL_PWD="$MYSQL_PASSWORD"
            exec mysql --default-character-set=utf8mb4 -N -s -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "
              SELECT \"protected_admin\",is_superadmin=1 AND deleted_at IS NULL FROM users WHERE id=\"demo\";
              SELECT \"deleted_account\",is_superadmin=0 AND active=0 AND deleted_at=\"2026-11-01 15:23:45\" FROM users WHERE id=\"former\";
              SELECT \"historical_owner\",user_id=\"former\" FROM records WHERE id=\"two\";
              SELECT \"compact_photo_removed\",JSON_CONTAINS_PATH(compact_data,\"one\",\"\$.photo\")=0 FROM records WHERE id=\"two\";
              SELECT \"utf8_customer\",JSON_UNQUOTE(JSON_EXTRACT(compact_data,\"\$.customer\"))=\"Pélanggan\" FROM records WHERE id=\"two\";
              SELECT \"photo_version\",photo_version=SHA2(JSON_UNQUOTE(JSON_EXTRACT(data,\"\$.photo\")),256) FROM records WHERE id=\"two\";
            "
          ' > "$RUNNER_TEMP/account-restore-checks"
          # Only synthetic check names and boolean results enter CI logs.
          cat "$RUNNER_TEMP/account-restore-checks"
          test "$(cat "$RUNNER_TEMP/account-restore-checks")" = "$(printf 'protected_admin\t1\ndeleted_account\t1\nhistorical_owner\t1\ncompact_photo_removed\t1\nutf8_customer\t1\nphoto_version\t1')"
      - name: Verify production service readiness with disposable notification keys
        run: |
          umask 077
          docker compose build web api
          docker run --rm ternaku-prod-api:local php -r '
            require "vendor/autoload.php";
            $keys=Minishlink\WebPush\VAPID::createVapidKeys();
            printf("WEB_PUSH_PUBLIC_KEY=%s\nWEB_PUSH_PRIVATE_KEY=%s\n",$keys["publicKey"],$keys["privateKey"]);
          ' > "$RUNNER_TEMP/disposable-push.env"
          set -a
          . "$RUNNER_TEMP/disposable-push.env"
          WEB_PUSH_SUBJECT=mailto:ci@example.invalid
          PROD_LEGACY_STATIC_DIR="$RUNNER_TEMP/old-public-assets"
          PROD_LEGACY_NGINX_CONF="$GITHUB_WORKSPACE/deploy/vps/production/nginx-legacy.conf"
          set +a
          install -d -m 0755 "$PROD_LEGACY_STATIC_DIR" "$PROD_LEGACY_STATIC_DIR/_next" "$PROD_LEGACY_STATIC_DIR/_next/static"
          echo 'old-public-asset' > "$PROD_LEGACY_STATIC_DIR/_next/static/old-0123456789abcdef.js"
          chmod 0644 "$PROD_LEGACY_STATIC_DIR/_next/static/old-0123456789abcdef.js"
          dc=(docker compose -f "$COMPOSE_FILE" -f deploy/vps/production/compose.legacy-assets.yaml)
          "${dc[@]}" up --no-build --pull never -d --wait --wait-timeout 150 web
          curl -fsS http://127.0.0.1:18183/ternaku/health | jq -e '.data.status=="ok" and .data.push_ready==true'
          curl -fsS http://127.0.0.1:18183/_next/static/old-0123456789abcdef.js | grep -Fx 'old-public-asset'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18183/_next/static/missing.js)" = 404
          test -z "$("${dc[@]}" --profile push ps --status running -q worker)"
          "${dc[@]}" --profile push up --no-build --pull never -d --wait --wait-timeout 150 worker
